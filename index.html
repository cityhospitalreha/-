<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#FAF6F0">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<title>口の体操</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    height:100%; background:#FAF6F0; color:#2E2620;
    font-family:-apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
    overflow:hidden; -webkit-user-select:none; user-select:none;
  }
  #app { position:relative; width:100%; height:100vh; height:100dvh; overflow:hidden; }
  [hidden] { display:none !important; }

  /* スタート画面 */
  #start-screen, #error-screen {
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:18px; padding:32px;
    text-align:center; background:radial-gradient(circle at 50% 30%, #FFFFFF, #F3ECE2);
  }
  .app-title { font-size:28px; font-weight:600; letter-spacing:.02em; color:#2E2620; }
  .app-desc  { font-size:15px; line-height:1.7; color:rgba(46,38,32,.65); max-width:320px; }
  .privacy-note { font-size:12px; color:rgba(46,38,32,.45); max-width:280px; line-height:1.6; }

  .setting-box {
    display:flex; flex-direction:column; gap:14px;
    background:rgba(0,0,0,.03); border:1px solid rgba(0,0,0,.1);
    border-radius:16px; padding:16px 24px; width:100%; max-width:300px;
  }
  .setting-row { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .setting-label { font-size:14px; color:rgba(46,38,32,.8); }
  .setting-stepper { display:flex; align-items:center; gap:12px; }
  .stepper-btn {
    background:rgba(0,0,0,.05); border:1px solid rgba(0,0,0,.15);
    color:#2E2620; font-size:20px; width:36px; height:36px;
    border-radius:8px; cursor:pointer; line-height:1;
  }
  .stepper-val { font-size:18px; font-weight:700; color:#B2673F; min-width:28px; text-align:center; }

  .btn-primary {
    background:linear-gradient(135deg,#C77B58,#B2673F); color:#FBF3EA;
    font-weight:600; font-size:17px; border:none; border-radius:999px;
    padding:16px 44px; min-height:52px; cursor:pointer;
    box-shadow:0 8px 24px rgba(178,103,63,.25); transition:transform .15s;
  }
  .btn-primary:active { transform:scale(.96); }

  /* カメラ画面 */
  #camera-screen { position:absolute; inset:0; display:flex; flex-direction:column; background:#FAF6F0; }

  #stage {
    position:relative; flex:1; min-height:0;
    display:flex; flex-direction:column;
    background:#EDE5D8; overflow:hidden;
  }
  @media (orientation:landscape) { #stage { flex-direction:row; } }

  .pane { position:relative; min-width:0; min-height:0; overflow:hidden; background:#FAF6F0; }

  /* 境界スライダー */
  #divider {
    position:absolute; z-index:30;
    background:rgba(178,103,63,.55);
    touch-action:none;
  }

  /* 見本ペイン：上=画像エリア、下=文字バー の縦2段構成 */
  #samplePane { display:flex; flex-direction:column; }
  #sampleImageArea { position:relative; flex:1; min-height:0; overflow:hidden; background:#FAF6F0; }

  #sampleCanvas {
    position:absolute; inset:0; width:100%; height:100%;
    background:#FFFDF9;
  }

  /* ラベル：左上（種目名）★大きく強調★ */
  .sample-label {
    position:absolute; top:10px; left:10px;
    background:rgba(0,0,0,.65); padding:8px 16px;
    border-radius:999px; font-size:16px; font-weight:700; color:#F5F5F0;
    pointer-events:none; z-index:2;
    box-shadow:0 2px 8px rgba(0,0,0,.3);
  }

  /* 回数・セット：右上 ★大きく強調★ */
  #setDisplay {
    position:absolute; top:10px; right:10px;
    background:rgba(0,0,0,.65); backdrop-filter:blur(6px);
    border-radius:12px; padding:8px 16px;
    font-size:17px; font-weight:800; color:#C77B58;
    line-height:1.4; pointer-events:none; z-index:2;
    box-shadow:0 2px 8px rgba(0,0,0,.3);
  }

  /* 発音文字表示：画像エリアの下にある専用バー
     顔の映像とは重ならない、独立したスペースに大きく表示する。
     min-heightではなく固定heightにしているのは、文字がある時とない時で
     バーの高さが変わり、画像エリアのサイズがガタつくのを防ぐため。 */
  #charBar {
    flex:0 0 auto;
    display:flex; align-items:center; justify-content:center;
    height:112px; min-height:0; max-height:112px; overflow:hidden;
    padding:0 12px; box-sizing:border-box;
    background:#FFFFFF;
  }
  #charBar.hidden { visibility:hidden; }
  #charText {
    font-size:clamp(40px, 11vw, 76px); font-weight:800; color:#B2673F;
    line-height:1; letter-spacing:.02em;
  }
  /* ストレッチの「○秒」表示は発音文字(あ・お・う等)と違い、
     訓練の主役ではなく補助情報なので、控えめなサイズ・色にする */
  #charText.countdown-text {
    font-size:26px; font-weight:600; color:rgba(46,38,32,.55);
    letter-spacing:.04em;
  }

  /* GIF操作：右下縦 */
  #gifCtrl {
    position:absolute; bottom:48px; right:8px;
    display:flex; flex-direction:column; align-items:center; gap:5px;
    background:rgba(0,0,0,.5); backdrop-filter:blur(6px);
    border-radius:12px; padding:8px 6px; z-index:2;
  }
  .gif-btn {
    background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.15);
    color:#F5F5F0; font-size:16px; width:36px; height:36px;
    border-radius:8px; cursor:pointer;
  }
  .gif-btn.active { background:rgba(199,123,88,.28); border-color:#C77B58; }
  #speedLabel { font-size:9px; color:rgba(245,245,240,.6); }

  /* 前へ・次へ：左下 */
  #sampleNav {
    position:absolute; bottom:8px; left:8px;
    display:flex; align-items:center; gap:8px; z-index:2;
  }
  .nav-btn {
    background:rgba(0,0,0,.5); backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,.15); color:#F5F5F0;
    font-size:14px; padding:9px 14px; border-radius:10px; cursor:pointer;
  }
  .nav-btn:active { transform:scale(.97); }
  #positionText { font-size:12px; color:rgba(245,245,240,.7); font-weight:600; }

  /* カメラペイン */
  video#video {
    position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover; background:#000;
  }
  video#video.mirrored { transform:scaleX(-1); }

  #guide-overlay {
    position:absolute; inset:0; display:flex;
    align-items:center; justify-content:center; pointer-events:none;
  }
  #guide-overlay .oval {
    width:56%; max-width:340px; aspect-ratio:3/4;
    border:2px dashed rgba(255,255,255,.55); border-radius:50%;
  }

  /* 下部コントロール */
  .controls {
    display:flex; justify-content:center; gap:12px;
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    background:#FFFFFF; border-top:1px solid rgba(0,0,0,.08);
  }
  .btn-control {
    background:rgba(0,0,0,.04); border:1px solid rgba(0,0,0,.12);
    color:#2E2620; font-size:14px; font-weight:500; border-radius:14px;
    padding:10px 18px; min-height:46px; min-width:88px; cursor:pointer;
  }
  .btn-control.active { background:rgba(178,103,63,.15); border-color:#B2673F; color:#B2673F; }
  .btn-control.danger { background:rgba(196,68,40,.08); border-color:rgba(196,68,40,.35); color:#C44428; }

  #error-screen .app-desc { color:#B24A38; }
</style>
</head>
<body>
<div id="app">

  <!-- スタート画面 -->
  <div id="start-screen">
    <div class="app-title">口の体操</div>
    <div class="app-desc">カメラに自分の顔を映して、表情の練習にお使いください。</div>
    <div class="setting-box">
      <div class="setting-row">
        <span class="setting-label">1セットの回数</span>
        <div class="setting-stepper">
          <button class="stepper-btn" id="repMinusBtn">－</button>
          <span class="stepper-val" id="repVal">5</span>
          <button class="stepper-btn" id="repPlusBtn">＋</button>
        </div>
      </div>
      <div class="setting-row">
        <span class="setting-label">セット数</span>
        <div class="setting-stepper">
          <button class="stepper-btn" id="setMinusBtn">－</button>
          <span class="stepper-val" id="setVal">2</span>
          <button class="stepper-btn" id="setPlusBtn">＋</button>
        </div>
      </div>
    </div>
    <button id="startBtn" class="btn-primary">カメラを起動</button>
    <div class="privacy-note">映像は録画・保存されず、外部にも送信されません。</div>
  </div>

  <!-- カメラ画面 -->
  <div id="camera-screen" hidden>
    <div id="stage">

      <div class="pane" id="samplePane">
        <div id="sampleImageArea">
          <canvas id="sampleCanvas"></canvas>
          <div class="sample-label" id="sampleLabel"></div>
          <div id="setDisplay"></div>

          <div id="gifCtrl">
            <button class="gif-btn" id="gifSlowBtn">🐢</button>
            <button class="gif-btn active" id="gifPlayBtn">⏸</button>
            <div id="speedLabel">標準</div>
          </div>

          <div id="sampleNav">
            <button class="nav-btn" id="prevBtn">◀ 前へ</button>
            <span id="positionText">1 / 8</span>
            <button class="nav-btn nav-next" id="nextBtn">次へ ▶</button>
          </div>
        </div>

        <!-- 発音文字は画像の下の専用バーに表示（顔の映像には重ねない） -->
        <div id="charBar" class="hidden">
          <span id="charText"></span>
        </div>
      </div>

      <div id="divider"></div>

      <div class="pane" id="cameraPane">
        <video id="video" autoplay playsinline muted></video>
        <div id="guide-overlay" hidden><div class="oval"></div></div>
      </div>

    </div>
    <div class="controls">
      <button id="guideToggleBtn" class="btn-control">ガイド表示</button>
      <button id="settingBtn"     class="btn-control">設定変更</button>
      <button id="stopBtn"        class="btn-control danger">終了</button>
    </div>
  </div>

  <!-- エラー画面 -->
  <div id="error-screen" hidden>
    <div class="app-title">カメラを起動できません</div>
    <div id="errorMessage" class="app-desc"></div>
    <button id="retryBtn" class="btn-primary">もう一度試す</button>
  </div>

</div>
<script>
// ================================================================
// 簡易GIFデコーダー＆自前プレーヤー
// ----------------------------------------------------------------
// <img>タグにGIFを表示させるとアニメーションの再生速度・一時停止を
// ブラウザに完全に任せることになり、正確な制御ができない
// （iPad Safariでは、隠れている/覆われている画像のGIFアニメーションを
// 　勝手に止めてしまうことがあるため、一時停止からの再開やスロー再生が
// 　安定しなかった）。
// そこで、GIFファイルのバイト列を自分で解析し(decodeGif)、
// 1コマずつ自分のタイマーでcanvasに描画するプレーヤー(GifPlayer)を使う。
// こうすればアニメーションの進み方を完全に自分でコントロールできる。
// ================================================================

// GIFファイルのバイト列(Uint8Array)を解析して
// { width, height, frames:[ {left,top,width,height,colorTable,indices,gce} ] }
// の形に変換する関数。
function decodeGif(buf) {
  let p = 0;
  const readByte = () => buf[p++];
  const readWord = () => { const v = buf[p] | (buf[p + 1] << 8); p += 2; return v; };
  const readBytes = (n) => { const s = buf.subarray(p, p + n); p += n; return s; };

  const sig = String.fromCharCode(...readBytes(6));
  if (sig.slice(0, 3) !== 'GIF') throw new Error('GIFファイルではありません');

  const width = readWord();
  const height = readWord();
  const packed = readByte();
  const gctFlag = (packed & 0x80) !== 0;
  const gctSize = 2 << (packed & 0x07);
  readByte(); // 背景色インデックス（未使用）
  readByte(); // ピクセルアスペクト比（未使用）

  function readColorTable(size) {
    const table = [];
    for (let i = 0; i < size; i++) table.push([readByte(), readByte(), readByte()]);
    return table;
  }
  const gct = gctFlag ? readColorTable(gctSize) : null;

  function readSubBlocks() {
    const chunks = [];
    let total = 0, size;
    while ((size = readByte()) !== 0) {
      const c = readBytes(size);
      chunks.push(c);
      total += size;
    }
    const out = new Uint8Array(total);
    let o = 0;
    for (const c of chunks) { out.set(c, o); o += c.length; }
    return out;
  }

  // GIF独自のLZW展開（符号長が可変で、辞書がクリアコードで初期化される方式）
  function lzwDecode(minCodeSize, data) {
    const clearCode = 1 << minCodeSize;
    const eoiCode = clearCode + 1;
    let codeSize, dict;
    function resetDict() {
      dict = [];
      for (let i = 0; i < clearCode; i++) dict[i] = [i];
      dict[clearCode] = null;
      dict[eoiCode] = null;
      codeSize = minCodeSize + 1;
    }
    resetDict();

    const output = [];
    let bitBuffer = 0, bitCount = 0, pos = 0, prev = null;

    function readCode() {
      while (bitCount < codeSize) {
        if (pos >= data.length) return eoiCode;
        bitBuffer |= data[pos++] << bitCount;
        bitCount += 8;
      }
      const code = bitBuffer & ((1 << codeSize) - 1);
      bitBuffer >>= codeSize;
      bitCount -= codeSize;
      return code;
    }

    while (pos < data.length || bitCount >= codeSize) {
      const code = readCode();
      if (code === clearCode) { resetDict(); prev = null; continue; }
      if (code === eoiCode) break;

      let entry;
      if (dict[code]) {
        entry = dict[code];
      } else if (code === dict.length && prev) {
        entry = prev.concat([prev[0]]);
      } else {
        break;
      }
      for (const v of entry) output.push(v);

      if (prev) {
        dict.push(prev.concat([entry[0]]));
        if (dict.length >= (1 << codeSize) && codeSize < 12) codeSize++;
      }
      prev = entry;
    }
    return output;
  }

  // インターレースGIFは行の並びが特殊なので、通常の上から順の並びに直す
  function deinterlace(indices, w, h) {
    const out = new Array(indices.length);
    const passes = [[0, 8], [4, 8], [2, 4], [1, 2]];
    let srcRow = 0;
    for (const [start, step] of passes) {
      for (let y = start; y < h; y += step) {
        const so = srcRow * w, do_ = y * w;
        for (let x = 0; x < w; x++) out[do_ + x] = indices[so + x];
        srcRow++;
      }
    }
    return out;
  }

  const frames = [];
  let gce = null; // 直前に読んだGraphic Control Extension（次のコマの表示時間などを持つ）

  while (p < buf.length) {
    const blockType = readByte();
    if (blockType === 0x21) { // 拡張ブロック
      const label = readByte();
      if (label === 0xF9) { // Graphic Control Extension（コマの表示時間・透過色）
        readByte(); // ブロックサイズ（常に4）
        const packedGce = readByte();
        const delay = readWord();
        const transparentIndex = readByte();
        readByte(); // ブロック終端
        gce = {
          disposal: (packedGce >> 2) & 0x07,
          transparentFlag: (packedGce & 0x01) !== 0,
          transparentIndex,
          delay: delay * 10, // 1/100秒 → ミリ秒に変換
        };
      } else {
        readSubBlocks(); // コメント等、使わない拡張は読み飛ばす
      }
    } else if (blockType === 0x2C) { // 画像本体（1コマ分）
      const left = readWord(), top = readWord();
      const fw = readWord(), fh = readWord();
      const packedImg = readByte();
      const lctFlag = (packedImg & 0x80) !== 0;
      const interlace = (packedImg & 0x40) !== 0;
      const lctSize = 2 << (packedImg & 0x07);
      const colorTable = lctFlag ? readColorTable(lctSize) : gct;

      const minCodeSize = readByte();
      const imgData = readSubBlocks();
      let indices = lzwDecode(minCodeSize, imgData);
      if (interlace) indices = deinterlace(indices, fw, fh);

      frames.push({
        left, top, width: fw, height: fh,
        colorTable, indices,
        gce: gce || { disposal: 0, transparentFlag: false, transparentIndex: -1, delay: 100 },
      });
      gce = null;
    } else if (blockType === 0x3B) { // トレーラー（ファイル終端）
      break;
    } else {
      break; // 未対応のブロックに来たら安全のため打ち切る
    }
  }

  return { width, height, frames };
}

// GIFを読み込んで、指定したcanvasに1コマずつ描画するプレーヤー
class GifPlayer {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    // GIF本来の解像度で組み立てるための、画面には出さない作業用canvas
    this.off = document.createElement('canvas');
    this.offCtx = this.off.getContext('2d');
    this.gif = null;
    this.frameIndex = 0;
    this.playing = false;
    this.rafId = null;
    this.lastTime = 0;
    this.speedMult = 1;         // 1=標準、2=2倍遅い、3=3倍遅い
    this._imageData = null;
    this._restoreSnapshot = null;
    this._loadToken = 0;        // 連打で読み込みが重なった時の対策
  }

  async load(url) {
    const token = ++this._loadToken;
    this.pause();
    const res = await fetch(url);
    if (!res.ok) throw new Error('GIF取得失敗: ' + url);
    const buf = new Uint8Array(await res.arrayBuffer());
    const gif = decodeGif(buf);
    if (token !== this._loadToken) return; // 途中で次の読み込みが始まっていたら破棄

    this.gif = gif;
    this.off.width = gif.width;
    this.off.height = gif.height;
    this.frameIndex = 0;
    this._restoreSnapshot = null;
    this._composeFrame(0, true);
    this.resize();
  }

  // idx番目のコマを、これまでの合成結果(this._imageData)に重ねて確定させる
  _composeFrame(idx, reset) {
    if (reset) this._imageData = this.offCtx.createImageData(this.gif.width, this.gif.height);
    const frame = this.gif.frames[idx];
    const buf = this._imageData.data;
    const gw = this.gif.width;

    if (frame.gce.disposal === 3 && !this._restoreSnapshot) {
      this._restoreSnapshot = new Uint8ClampedArray(buf); // 「前の状態に戻す」用に退避
    }

    for (let y = 0; y < frame.height; y++) {
      for (let x = 0; x < frame.width; x++) {
        const ci = frame.indices[y * frame.width + x];
        if (frame.gce.transparentFlag && ci === frame.gce.transparentIndex) continue;
        const c = frame.colorTable && frame.colorTable[ci];
        if (!c) continue;
        const px = ((frame.top + y) * gw + (frame.left + x)) * 4;
        buf[px] = c[0]; buf[px + 1] = c[1]; buf[px + 2] = c[2]; buf[px + 3] = 255;
      }
    }
    this.offCtx.putImageData(this._imageData, 0, 0);

    // 次コマを描く前に、このコマの後始末（disposal method）を行う
    if (frame.gce.disposal === 2) {
      for (let y = 0; y < frame.height; y++) {
        for (let x = 0; x < frame.width; x++) {
          const px = ((frame.top + y) * gw + (frame.left + x)) * 4;
          buf[px + 3] = 0;
        }
      }
    } else if (frame.gce.disposal === 3 && this._restoreSnapshot) {
      buf.set(this._restoreSnapshot);
      this._restoreSnapshot = null;
    }
  }

  // 作業用canvasの内容を、縦横比を保ったまま表示用canvasへ描く
  render() {
    if (!this.gif) return;
    const cw = this.canvas.width, ch = this.canvas.height;
    const gw = this.gif.width, gh = this.gif.height;
    if (!cw || !ch) return;
    const scale = Math.min(cw / gw, ch / gh);
    const dw = gw * scale, dh = gh * scale;
    const dx = (cw - dw) / 2, dy = (ch - dh) / 2;
    this.ctx.fillStyle = '#FFFDF9';
    this.ctx.fillRect(0, 0, cw, ch);
    this.ctx.drawImage(this.off, dx, dy, dw, dh);
  }

  // 表示先のピクセルサイズが変わったとき（画面回転・分割線ドラッグ等）に呼ぶ
  resize() {
    this.canvas.width = this.canvas.clientWidth;
    this.canvas.height = this.canvas.clientHeight;
    this.render();
  }

  play() {
    if (this.playing || !this.gif) return;
    this.playing = true;
    this.lastTime = performance.now();
    const loop = (now) => {
      if (!this.playing) return;
      const frame = this.gif.frames[this.frameIndex];
      // GIFファイル側の表示時間(delay)が極端に短い(0など)場合、
      // 多くのブラウザは慣習的に100msとして扱う。ここも同じルールに合わせる。
      const rawDelay = frame.gce.delay;
      const baseDelay = rawDelay < 20 ? 100 : rawDelay;
      const delay = baseDelay * this.speedMult;
      if (now - this.lastTime >= delay) {
        this.frameIndex = (this.frameIndex + 1) % this.gif.frames.length;
        this._composeFrame(this.frameIndex);
        this.render();
        this.lastTime = now;
      }
      this.rafId = requestAnimationFrame(loop);
    };
    this.rafId = requestAnimationFrame(loop);
  }

  // 一時停止：自分のタイマーを止めるだけなので確実に止まる
  pause() {
    this.playing = false;
    if (this.rafId) cancelAnimationFrame(this.rafId);
    this.rafId = null;
  }

  // 最初のコマから再生し直す
  restart() {
    this.pause();
    if (!this.gif) return;
    this.frameIndex = 0;
    this._restoreSnapshot = null;
    this._composeFrame(0, true);
    this.render();
    this.play();
  }

  setSpeed(mult) {
    this.speedMult = mult;
  }
}

const SAMPLES = [
  { file:'samples/16.gif', label:'頸部のストレッチ　前屈－正面－後屈（正面・真横 同時表示／前5秒・後5秒）', countdown:true },
  { file:'samples/14.gif', label:'頸部のストレッチ　右－左（右5秒・左5秒）', countdown:true },
  { file:'samples/15.gif', label:'頸部のストレッチ　右回旋－左回旋（右5秒・左5秒）', countdown:true },
  { file:'samples/01.gif', label:'開口－閉口',               chars:['あ','ん'] },
  { file:'samples/05.gif', label:'口唇の突出－引き（う・い）', chars:['う','い'] },
  { file:'samples/04.gif', label:'口唇の運動（あ・お・う）',   chars:['あ','お','う'] },
  { file:'samples/12.gif', label:'両頬の膨らませ' },
  { file:'samples/13.gif', label:'左右頬の膨らませ' },
  { file:'samples/02.gif', label:'舌の突出－引き' },
  { file:'samples/08.gif', label:'舌の左右' },
  { file:'samples/06.gif', label:'舌の上下' },
  { file:'samples/10.gif', label:'舌の運動（一周・時計回り）' },
  { file:'samples/11.gif', label:'舌の運動（一周・反時計回り）' },
];

// ===== 設定 =====
let repCount = 5, setCount = 2;
const repValEl = document.getElementById('repVal');
const setValEl = document.getElementById('setVal');
document.getElementById('repMinusBtn').onclick = () => { if(repCount>1)  repCount--, repValEl.textContent=repCount; };
document.getElementById('repPlusBtn').onclick  = () => { if(repCount<20) repCount++, repValEl.textContent=repCount; };
document.getElementById('setMinusBtn').onclick = () => { if(setCount>1)  setCount--, setValEl.textContent=setCount; };
document.getElementById('setPlusBtn').onclick  = () => { if(setCount<10) setCount++, setValEl.textContent=setCount; };

// ===== サンプル =====
let sampleIndex = 0;
const sampleCanvas = document.getElementById('sampleCanvas');
const sampleLabel  = document.getElementById('sampleLabel');
const setDisplay   = document.getElementById('setDisplay');
const posText      = document.getElementById('positionText');
const player = new GifPlayer(sampleCanvas);

async function loadSample(idx) {
  sampleIndex = idx;
  const s = SAMPLES[idx];
  sampleLabel.textContent = s.label;
  posText.textContent     = (idx+1) + ' / ' + SAMPLES.length;
  setDisplay.textContent  = repCount + '回 × ' + setCount + 'セット';
  gifPaused = false;
  gifPlayBtn.classList.add('active');
  gifPlayBtn.textContent = '⏸';
  // GIFファイルの読み込み・解析には数十〜数百msかかるため、
  // その間は文字の切り替えタイマーを止めておく。
  // （先に文字だけ動かし始めると、GIFの再生開始が遅れて常にズレて見える）
  stopCharCycle();
  try {
    await player.load(s.file);
    player.setSpeed(SPEEDS[speedIdx].mult);
    player.play();
    // GIFの再生を開始したのと同じタイミングで文字も開始する
    updateCharDisplay();
    startCharCycle();
  } catch (e) {
    console.error('GIFの読み込みに失敗しました:', s.file, e);
  }
}

document.getElementById('prevBtn').onclick = () => loadSample((sampleIndex-1+SAMPLES.length)%SAMPLES.length);
document.getElementById('nextBtn').onclick = () => loadSample((sampleIndex+1)%SAMPLES.length);

// ===== 発音文字の大きな表示 =====
// SAMPLES[].chars に設定した文字（例：['あ','ん']）を
// 一定間隔で順番に切り替えて、画像の下の#charBarに表示する。
// ブラウザからはGIFの内部コマ位置を読み取れないため、
// 完全なコマ同期ではなく「タイマーによる一定間隔切り替え」で近似している。
const charBar  = document.getElementById('charBar');
const charText = document.getElementById('charText');
let charIdx = 0;
let charTimer = null;

// 1文字あたりの標準表示時間（ミリ秒）。
// 種目によって口の動く速さが違う場合は、SAMPLES側の
// charInterval に個別の数値を指定すると、そちらが優先される。
const CHAR_BASE_INTERVAL = 700;

// 🐢ボタンの speedIdx（0=ゆっくり, 1=標準）に対応した倍率。
const CHAR_SPEED_MULT = [2, 1];

function currentCharInterval() {
  const base = SAMPLES[sampleIndex].charInterval || CHAR_BASE_INTERVAL;
  return base * CHAR_SPEED_MULT[speedIdx];
}

function updateCharDisplay() {
  const s = SAMPLES[sampleIndex];
  if (s.countdown) {
    charBar.classList.remove('hidden');
    charText.classList.add('countdown-text');
    updateCountdownDisplay();
    return;
  }
  charText.classList.remove('countdown-text');
  const chars = s.chars;
  if (!chars || chars.length === 0) {
    charBar.classList.add('hidden');
    charText.textContent = '';
    return;
  }
  charBar.classList.remove('hidden');
  charIdx = 0;
  charText.textContent = chars[charIdx];
}

function startCharCycle() {
  stopCharCycle();
  const s = SAMPLES[sampleIndex];
  if (s.countdown) {
    // ストレッチ種目：数字を秒ごとに切り替えるカウントダウンではなく、
    // 「保持コマの間だけ固定で"○秒"と表示する」だけのシンプルな仕組みにする。
    // コマが変わるたびに表示を更新すればよいので、頻繁なタイマーは不要。
    charTimer = setInterval(updateCountdownDisplay, 200);
    return;
  }
  const chars = s.chars;
  if (!chars || chars.length === 0) return;
  charTimer = setInterval(() => {
    charIdx = (charIdx + 1) % chars.length;
    charText.textContent = chars[charIdx];
  }, currentCharInterval());
}

// 今再生中のコマが「保持コマ」（1.5秒より長いコマ）かどうかを見て、
// そうであれば固定で「○秒」と表示する。正面などの短いつなぎコマの間は何も出さない。
// ライブでカウントダウンさせない（数字を毎秒切り替えない）のは、
// 表示のたびに文字幅が変わってバー内の位置がガタつくのを避けるため。
function updateCountdownDisplay() {
  if (!player.gif) { charText.textContent = ''; return; }
  const frame = player.gif.frames[player.frameIndex];
  const rawDelay = frame.gce.delay;
  const baseDelay = rawDelay < 20 ? 100 : rawDelay;
  if (baseDelay <= 1500) {
    charText.textContent = '';
    return;
  }
  const sec = Math.round(baseDelay / 1000);
  charText.textContent = sec + '秒';
}

function stopCharCycle() {
  if (charTimer) { clearInterval(charTimer); charTimer = null; }
}

// ===== GIF 一時停止・スロー再生 =====
// これまでは<img>のGIF自動再生をブラウザに任せていたが、
// ・一時停止させる方法が「隠して静止画に差し替える」しかない
// ・iPad Safariは非表示/隠れた画像のGIFアニメーションを止めてしまう
// という2つの理由で、正確な一時停止・スロー再生ができなかった。
// そこで、GIFファイルの中身を自分で解析し（decodeGif関数）、
// 1コマずつ自分のタイマーでcanvasに描画するプレーヤー(GifPlayer)を使う。
// こうすればブラウザの裏側の挙動に一切左右されない。
let gifPaused = false;
const gifPlayBtn = document.getElementById('gifPlayBtn');
const speedLabel = document.getElementById('speedLabel');

gifPlayBtn.onclick = () => {
  if (!gifPaused) {
    // 一時停止：自分のタイマーを止めるだけなので確実に止まる
    gifPaused = true;
    player.pause();
    gifPlayBtn.classList.remove('active');
    gifPlayBtn.textContent = '▶';
    stopCharCycle();
  } else {
    // 再生再開：最初のコマから再生し直す
    gifPaused = false;
    player.restart();
    gifPlayBtn.classList.add('active');
    gifPlayBtn.textContent = '⏸';
    updateCharDisplay();
    startCharCycle();
  }
};

// ===== GIF 速度 =====
// 各コマの表示時間(GIFファイルに記録された実際のディレイ)に
// 倍率をかけることで、正確なスロー再生を実現する。
const SPEEDS = [
  { label:'ゆっくり', mult:2 },
  { label:'標準',    mult:1 },
];
let speedIdx = 1;

function applySpeed() {
  speedLabel.textContent = SPEEDS[speedIdx].label;
  player.setSpeed(SPEEDS[speedIdx].mult);
  // 速度が変わったら、文字の切り替え間隔も合わせて更新
  if (!gifPaused) startCharCycle();
}

// 🐢 押すたびに 標準→ゆっくり→遅い×2→標準 とトグル
document.getElementById('gifSlowBtn').onclick = () => {
  speedIdx = (speedIdx - 1 + SPEEDS.length) % SPEEDS.length;
  applySpeed();
};

// ===== 境界スライダー =====
const stage      = document.getElementById('stage');
const samplePane = document.getElementById('samplePane');
const cameraPane = document.getElementById('cameraPane');
const divider    = document.getElementById('divider');
let splitRatio   = 0.42;
let isDragging   = false;

function isLandscape() { return window.innerWidth > window.innerHeight; }

function updateLayout() {
  const land = isLandscape();
  if (!land) {
    // 縦：上下分割
    samplePane.style.cssText = `height:${splitRatio*100}%;width:100%;flex:none;`;
    cameraPane.style.cssText = `height:${(1-splitRatio)*100}%;width:100%;flex:none;`;
    divider.style.cssText    = `left:0;right:0;top:calc(${splitRatio*100}% - 3px);height:6px;width:100%;cursor:ns-resize;`;
  } else {
    // 横：左右分割
    samplePane.style.cssText = `width:${splitRatio*100}%;height:100%;flex:none;`;
    cameraPane.style.cssText = `width:${(1-splitRatio)*100}%;height:100%;flex:none;`;
    divider.style.cssText    = `top:0;bottom:0;left:calc(${splitRatio*100}% - 3px);width:6px;height:100%;cursor:ew-resize;`;
  }
}

divider.addEventListener('pointerdown', e => {
  isDragging = true;
  divider.setPointerCapture(e.pointerId);
  e.preventDefault();
});
divider.addEventListener('pointermove', e => {
  if (!isDragging) return;
  const r = stage.getBoundingClientRect();
  if (!isLandscape()) {
    splitRatio = Math.min(0.85, Math.max(0.15, (e.clientY - r.top) / r.height));
  } else {
    splitRatio = Math.min(0.85, Math.max(0.15, (e.clientX - r.left) / r.width));
  }
  updateLayout();
});
divider.addEventListener('pointerup',    () => { isDragging = false; player.resize(); });
divider.addEventListener('pointercancel',() => { isDragging = false; });
window.addEventListener('resize', () => { updateLayout(); player.resize(); });

// ===== カメラ =====
const startScreen  = document.getElementById('start-screen');
const cameraScreen = document.getElementById('camera-screen');
const errorScreen  = document.getElementById('error-screen');
const video        = document.getElementById('video');
const guideOverlay = document.getElementById('guide-overlay');
let currentStream  = null;
let guideVisible   = false;

function showScreen(name) {
  startScreen.hidden  = name !== 'start';
  cameraScreen.hidden = name !== 'camera';
  errorScreen.hidden  = name !== 'error';
}

async function startCamera() {
  stopCamera();
  speedIdx = 1;
  applySpeed();
  showScreen('camera');
  requestAnimationFrame(updateLayout);
  try {
    // カメラの許可ダイアログが表示されている間はGIF・文字のタイマーを動かさない。
    // （許可待ちの間はブラウザがタイマー処理を一時止めることがあり、
    // 　そのままGIFと文字を先に動かし始めていると、許可後の再開時に
    // 　両者がズレて見えることがあるため、許可が済んでから再生を始める）
    const stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'user' }, audio:false });
    currentStream = stream;
    video.srcObject = stream;
    video.classList.add('mirrored');
    await loadSample(0);
  } catch(err) { showError(err); }
}

function stopCamera() {
  if (currentStream) { currentStream.getTracks().forEach(t=>t.stop()); currentStream=null; }
  // 一時停止・スロー再生の状態を確実にリセットしておく。
  // ここをリセットし忘れると、「終了」→もう一度「カメラを起動」した際に
  // 前回の一時停止画面や遅い速度設定が残ってしまうバグになる。
  gifPaused = false;
  player.pause();
  stopCharCycle();
}

function showError(err) {
  let msg = 'カメラを起動できませんでした。';
  if (err?.name==='NotAllowedError')  msg='カメラへのアクセスが許可されていません。「設定」→「Safari」→「カメラ」で許可してください。';
  if (err?.name==='NotFoundError')    msg='カメラが見つかりませんでした。';
  if (err?.name==='NotReadableError') msg='他のアプリがカメラを使用している可能性があります。';
  document.getElementById('errorMessage').textContent = msg;
  showScreen('error');
}

document.getElementById('startBtn').onclick   = () => startCamera();
document.getElementById('retryBtn').onclick   = () => startCamera();
document.getElementById('stopBtn').onclick    = () => { stopCamera(); showScreen('start'); };
document.getElementById('settingBtn').onclick = () => { stopCamera(); showScreen('start'); };

document.getElementById('guideToggleBtn').onclick = () => {
  guideVisible = !guideVisible;
  guideOverlay.hidden = !guideVisible;
  const btn = document.getElementById('guideToggleBtn');
  btn.classList.toggle('active', guideVisible);
  btn.textContent = guideVisible ? 'ガイド非表示' : 'ガイド表示';
};

document.addEventListener('visibilitychange', () => {
  if (document.hidden) stopCamera();
  else if (!cameraScreen.hidden && !currentStream) startCamera();
});
window.addEventListener('pagehide', stopCamera);

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
</script>
