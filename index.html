<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0e10">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<title>表情ミラー</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    height:100%; background:#0b0e10; color:#F5F5F0;
    font-family:-apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
    overflow:hidden; -webkit-user-select:none; user-select:none;
  }
  #app { position:relative; width:100%; height:100vh; height:100dvh; overflow:hidden; }
  [hidden] { display:none !important; }

  /* スタート画面 */
  #start-screen, #error-screen {
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:18px; padding:32px;
    text-align:center; background:radial-gradient(circle at 50% 30%, #161b1e, #0b0e10);
  }
  .app-title { font-size:28px; font-weight:600; letter-spacing:.02em; }
  .app-desc  { font-size:15px; line-height:1.7; color:rgba(245,245,240,.65); max-width:320px; }
  .privacy-note { font-size:12px; color:rgba(245,245,240,.4); max-width:280px; line-height:1.6; }

  .setting-box {
    display:flex; flex-direction:column; gap:14px;
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12);
    border-radius:16px; padding:16px 24px; width:100%; max-width:300px;
  }
  .setting-row { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .setting-label { font-size:14px; color:rgba(245,245,240,.8); }
  .setting-stepper { display:flex; align-items:center; gap:12px; }
  .stepper-btn {
    background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.2);
    color:#F5F5F0; font-size:20px; width:36px; height:36px;
    border-radius:8px; cursor:pointer; line-height:1;
  }
  .stepper-val { font-size:18px; font-weight:700; color:#6EE7DE; min-width:28px; text-align:center; }

  .btn-primary {
    background:linear-gradient(135deg,#6EE7DE,#4FC3BD); color:#06201D;
    font-weight:600; font-size:17px; border:none; border-radius:999px;
    padding:16px 44px; min-height:52px; cursor:pointer;
    box-shadow:0 8px 24px rgba(110,231,222,.25); transition:transform .15s;
  }
  .btn-primary:active { transform:scale(.96); }

  /* カメラ画面 */
  #camera-screen { position:absolute; inset:0; display:flex; flex-direction:column; }

  #stage {
    position:relative; flex:1; min-height:0;
    display:flex; flex-direction:column;
    background:#000; overflow:hidden;
  }
  @media (orientation:landscape) { #stage { flex-direction:row; } }

  .pane { position:relative; min-width:0; min-height:0; overflow:hidden; background:#0b0e10; }

  /* 境界スライダー */
  #divider {
    position:absolute; z-index:30;
    background:rgba(110,231,222,.5);
    touch-action:none;
  }

  /* 見本ペイン：上=画像エリア、下=文字バー の縦2段構成 */
  #samplePane { display:flex; flex-direction:column; }
  #sampleImageArea { position:relative; flex:1; min-height:0; overflow:hidden; background:#0b0e10; }

  #sampleImg {
    position:absolute; inset:0; width:100%; height:100%;
    object-fit:contain; object-position:center;
    background:#05070a;
  }

  /* ラベル：左上（種目名）★大きく強調★ */
  .sample-label {
    position:absolute; top:10px; left:10px;
    background:rgba(0,0,0,.65); padding:8px 16px;
    border-radius:999px; font-size:16px; font-weight:700; color:#F5F5F0;
    pointer-events:none; z-index:2;
    box-shadow:0 2px 8px rgba(0,0,0,.3);
  }

  /* 回数・セット：右上 ★大きく強調★ */
  #setDisplay {
    position:absolute; top:10px; right:10px;
    background:rgba(0,0,0,.65); backdrop-filter:blur(6px);
    border-radius:12px; padding:8px 16px;
    font-size:17px; font-weight:800; color:#6EE7DE;
    line-height:1.4; pointer-events:none; z-index:2;
    box-shadow:0 2px 8px rgba(0,0,0,.3);
  }

  /* 発音文字表示：画像エリアの下にある専用バー
     顔の映像とは重ならない、独立したスペースに大きく表示する */
  #charBar {
    flex:0 0 auto;
    display:flex; align-items:center; justify-content:center;
    min-height:96px; padding:8px 12px;
    background:#12171a; border-top:1px solid rgba(255,255,255,.08);
  }
  #charBar.hidden { display:none; }
  #charText {
    font-size:clamp(48px, 13vw, 96px); font-weight:800; color:#6EE7DE;
    line-height:1; letter-spacing:.03em;
  }

  /* GIF操作：右下縦 */
  #gifCtrl {
    position:absolute; bottom:48px; right:8px;
    display:flex; flex-direction:column; align-items:center; gap:5px;
    background:rgba(0,0,0,.5); backdrop-filter:blur(6px);
    border-radius:12px; padding:8px 6px; z-index:2;
  }
  .gif-btn {
    background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.15);
    color:#F5F5F0; font-size:16px; width:36px; height:36px;
    border-radius:8px; cursor:pointer;
  }
  .gif-btn.active { background:rgba(110,231,222,.25); border-color:#6EE7DE; }
  #speedLabel { font-size:9px; color:rgba(245,245,240,.6); }

  /* 前へ・次へ：左下 */
  #sampleNav {
    position:absolute; bottom:8px; left:8px;
    display:flex; align-items:center; gap:6px; z-index:2;
  }
  .nav-btn {
    background:rgba(0,0,0,.5); backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,.15); color:#F5F5F0;
    font-size:12px; padding:6px 12px; border-radius:8px; cursor:pointer;
  }
  #positionText { font-size:11px; color:rgba(245,245,240,.6); }

  /* カメラペイン */
  video#video {
    position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover; background:#000;
  }
  video#video.mirrored { transform:scaleX(-1); }

  #guide-overlay {
    position:absolute; inset:0; display:flex;
    align-items:center; justify-content:center; pointer-events:none;
  }
  #guide-overlay .oval {
    width:56%; max-width:340px; aspect-ratio:3/4;
    border:2px dashed rgba(255,255,255,.55); border-radius:50%;
  }

  /* 下部コントロール */
  .controls {
    display:flex; justify-content:center; gap:12px;
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    background:#0b0e10; border-top:1px solid rgba(255,255,255,.08);
  }
  .btn-control {
    background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.18);
    color:#F5F5F0; font-size:14px; font-weight:500; border-radius:14px;
    padding:10px 18px; min-height:46px; min-width:88px; cursor:pointer;
  }
  .btn-control.active { background:rgba(110,231,222,.22); border-color:#6EE7DE; color:#6EE7DE; }
  .btn-control.danger { background:rgba(255,138,101,.16); border-color:rgba(255,138,101,.4); color:#FF8A65; }

  #error-screen .app-desc { color:rgba(255,200,190,.85); }
</style>
</head>
<body>
<div id="app">

  <!-- スタート画面 -->
  <div id="start-screen">
    <div class="app-title">表情ミラー</div>
    <div class="app-desc">カメラに自分の顔を映して、表情の練習にお使いください。</div>
    <div class="setting-box">
      <div class="setting-row">
        <span class="setting-label">1セットの回数</span>
        <div class="setting-stepper">
          <button class="stepper-btn" id="repMinusBtn">－</button>
          <span class="stepper-val" id="repVal">5</span>
          <button class="stepper-btn" id="repPlusBtn">＋</button>
        </div>
      </div>
      <div class="setting-row">
        <span class="setting-label">セット数</span>
        <div class="setting-stepper">
          <button class="stepper-btn" id="setMinusBtn">－</button>
          <span class="stepper-val" id="setVal">2</span>
          <button class="stepper-btn" id="setPlusBtn">＋</button>
        </div>
      </div>
    </div>
    <button id="startBtn" class="btn-primary">カメラを起動</button>
    <div class="privacy-note">映像は録画・保存されず、外部にも送信されません。</div>
  </div>

  <!-- カメラ画面 -->
  <div id="camera-screen" hidden>
    <div id="stage">

      <div class="pane" id="samplePane">
        <div id="sampleImageArea">
          <img id="sampleImg" src="" alt="">
          <div class="sample-label" id="sampleLabel"></div>
          <div id="setDisplay"></div>

          <div id="gifCtrl">
            <button class="gif-btn" id="gifSlowBtn">🐢</button>
            <button class="gif-btn active" id="gifPlayBtn">⏸</button>
            <div id="speedLabel">標準</div>
          </div>

          <div id="sampleNav">
            <button class="nav-btn" id="prevBtn">◀ 前へ</button>
            <span id="positionText">1 / 8</span>
            <button class="nav-btn" id="nextBtn">次へ ▶</button>
          </div>
        </div>

        <!-- 発音文字は画像の下の専用バーに表示（顔の映像には重ねない） -->
        <div id="charBar" class="hidden">
          <span id="charText"></span>
        </div>
      </div>

      <div id="divider"></div>

      <div class="pane" id="cameraPane">
        <video id="video" autoplay playsinline muted></video>
        <div id="guide-overlay" hidden><div class="oval"></div></div>
      </div>

    </div>
    <div class="controls">
      <button id="guideToggleBtn" class="btn-control">ガイド表示</button>
      <button id="settingBtn"     class="btn-control">設定変更</button>
      <button id="stopBtn"        class="btn-control danger">終了</button>
    </div>
  </div>

  <!-- エラー画面 -->
  <div id="error-screen" hidden>
    <div class="app-title">カメラを起動できません</div>
    <div id="errorMessage" class="app-desc"></div>
    <button id="retryBtn" class="btn-primary">もう一度試す</button>
  </div>

</div>
<script>
const SAMPLES = [
  { file:'samples/01.gif', label:'開口－閉口',               chars:['あ','ん'] },
  { file:'samples/05.gif', label:'口唇の突出－引き（う・い）', chars:['う','い'] },
  { file:'samples/04.gif', label:'口唇の運動（あ・お・う）',   chars:['あ','お','う'] },
  { file:'samples/02.gif', label:'舌の突出－引き' },
  { file:'samples/08.gif', label:'舌の左右' },
  { file:'samples/06.gif', label:'舌の上下' },
  { file:'samples/10.gif', label:'舌の運動（一周・時計回り）' },
  { file:'samples/11.gif', label:'舌の運動（一周・反時計回り）' },
];

// ===== 設定 =====
let repCount = 5, setCount = 2;
const repValEl = document.getElementById('repVal');
const setValEl = document.getElementById('setVal');
document.getElementById('repMinusBtn').onclick = () => { if(repCount>1)  repCount--, repValEl.textContent=repCount; };
document.getElementById('repPlusBtn').onclick  = () => { if(repCount<20) repCount++, repValEl.textContent=repCount; };
document.getElementById('setMinusBtn').onclick = () => { if(setCount>1)  setCount--, setValEl.textContent=setCount; };
document.getElementById('setPlusBtn').onclick  = () => { if(setCount<10) setCount++, setValEl.textContent=setCount; };

// ===== サンプル =====
let sampleIndex = 0;
const sampleImg   = document.getElementById('sampleImg');
const sampleLabel = document.getElementById('sampleLabel');
const setDisplay  = document.getElementById('setDisplay');
const posText     = document.getElementById('positionText');

function loadSample(idx) {
  sampleIndex = idx;
  const s = SAMPLES[idx];
  // GIFアニメをリセット：srcを空にしてから再セット
  sampleImg.src = '';
  sampleImg.src = s.file;
  sampleLabel.textContent = s.label;
  posText.textContent     = (idx+1) + ' / ' + SAMPLES.length;
  setDisplay.textContent  = repCount + '回 × ' + setCount + 'セット';
  // 再生中状態に戻す
  gifPaused = false;
  gifPlayBtn.classList.add('active');
  gifPlayBtn.textContent = '⏸';
  // 発音文字表示をリセットして開始
  updateCharDisplay();
  startCharCycle();
}

document.getElementById('prevBtn').onclick = () => loadSample((sampleIndex-1+SAMPLES.length)%SAMPLES.length);
document.getElementById('nextBtn').onclick = () => loadSample((sampleIndex+1)%SAMPLES.length);

// ===== 発音文字の大きな表示 =====
// SAMPLES[].chars に設定した文字（例：['あ','ん']）を
// 一定間隔で順番に切り替えて、画像の下の#charBarに表示する。
// ブラウザからはGIFの内部コマ位置を読み取れないため、
// 完全なコマ同期ではなく「タイマーによる一定間隔切り替え」で近似している。
const charBar  = document.getElementById('charBar');
const charText = document.getElementById('charText');
let charIdx = 0;
let charTimer = null;

// 1文字あたりの標準表示時間（ミリ秒）。
// 種目によって口の動く速さが違う場合は、SAMPLES側の
// charInterval に個別の数値を指定すると、そちらが優先される。
const CHAR_BASE_INTERVAL = 700;

// 🐢ボタンの speedIdx（0=遅い×2, 1=ゆっくり, 2=標準）に対応した倍率。
const CHAR_SPEED_MULT = [3, 2, 1];

function currentCharInterval() {
  const base = SAMPLES[sampleIndex].charInterval || CHAR_BASE_INTERVAL;
  return base * CHAR_SPEED_MULT[speedIdx];
}

function updateCharDisplay() {
  const chars = SAMPLES[sampleIndex].chars;
  if (!chars || chars.length === 0) {
    charBar.classList.add('hidden');
    charText.textContent = '';
    return;
  }
  charBar.classList.remove('hidden');
  charIdx = 0;
  charText.textContent = chars[charIdx];
}

function startCharCycle() {
  stopCharCycle();
  const chars = SAMPLES[sampleIndex].chars;
  if (!chars || chars.length === 0) return;
  charTimer = setInterval(() => {
    charIdx = (charIdx + 1) % chars.length;
    charText.textContent = chars[charIdx];
  }, currentCharInterval());
}

function stopCharCycle() {
  if (charTimer) { clearInterval(charTimer); charTimer = null; }
}

// ===== GIF 一時停止 =====
// ブラウザのGIFアニメは直接止められないため
// 一時停止時：imgをhideしてcanvasに静止画を描画
// 再生時：canvasをhideしてimgを表示
let gifPaused = false;
const gifPlayBtn = document.getElementById('gifPlayBtn');
const speedLabel = document.getElementById('speedLabel');

// 一時停止用canvas（sampleImageAreaに重ねる。samplePane全体ではなく画像エリアだけ覆う）
const pauseCanvas = document.createElement('canvas');
pauseCanvas.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;background:#05070a;display:none;';
document.getElementById('sampleImageArea').appendChild(pauseCanvas);
const pCtx = pauseCanvas.getContext('2d');

// ===== canvasに縦横比を保って描画する共通関数 =====
// SafariはCSSのobject-fit:containを<canvas>には適用してくれないため
// （<img>には効くが<canvas>には効かないSafari側の制限）、
// 「枠の中に収まるサイズ・位置」をJavaScript側で自分で計算して描画する。
//   ctx    : 描画先のcanvasの2Dコンテキスト
//   canvas : 描画先のcanvas要素（枠と同じピクセルサイズにしておく）
//   img    : 描画元の画像（sampleImg）
function drawImageContain(ctx, canvas, img) {
  const iw = img.naturalWidth, ih = img.naturalHeight;
  if (!iw || !ih) return; // 画像がまだ読み込まれていない場合は何もしない
  const cw = canvas.width, ch = canvas.height;
  const scale = Math.min(cw / iw, ch / ih);
  const dw = iw * scale, dh = ih * scale;
  const dx = (cw - dw) / 2, dy = (ch - dh) / 2;
  ctx.fillStyle = '#05070a';
  ctx.fillRect(0, 0, cw, ch);
  ctx.drawImage(img, dx, dy, dw, dh);
}

gifPlayBtn.onclick = () => {
  if (!gifPaused) {
    // 一時停止：imgの現在フレームをcanvasに焼き付けて、canvasで画像の上を覆う
    // ※ imgはvisibility:hiddenにしない。iPadのSafariは「非表示の画像」の
    //   GIFアニメーションを止めてしまうため、隠すと裏で再生されなくなる。
    //   imgは裏で表示したまま動かし続け、canvasを上に重ねて見た目だけ隠す。
    gifPaused = true;
    pauseCanvas.width  = sampleImg.clientWidth;
    pauseCanvas.height = sampleImg.clientHeight;
    drawImageContain(pCtx, pauseCanvas, sampleImg);
    pauseCanvas.style.display = 'block';
    gifPlayBtn.classList.remove('active');
    gifPlayBtn.textContent = '▶';
    // 文字の切り替えも止める
    stopCharCycle();
  } else {
    // 再生再開
    gifPaused = false;
    pauseCanvas.style.display = 'none';
    // GIFを最初から再生
    const src = sampleImg.src;
    sampleImg.src = '';
    sampleImg.src = src;
    gifPlayBtn.classList.add('active');
    gifPlayBtn.textContent = '⏸';
    // 文字表示も最初から再開
    updateCharDisplay();
    startCharCycle();
  }
};

// ===== GIF 速度 =====
// GIFの速度はCSSアニメで直接変えられないため、
// imgは裏で普通に再生させたまま、一定間隔でcanvasに焼き付けて
// その上に不透明に重ねることでスロー再生に見せる。
// （imgをvisibility:hiddenで隠すと、iPad SafariがそのGIFの
// 　アニメーションそのものを止めてしまうため、絶対に隠さない）
const SPEEDS = [
  { label:'遅い×2',  interval:200 },
  { label:'ゆっくり', interval:120 },
  { label:'標準',    interval:0   },
];
let speedIdx = 2;
let slowTimer = null;
const slowCanvas = document.createElement('canvas');
slowCanvas.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;background:#05070a;display:none;';
document.getElementById('sampleImageArea').appendChild(slowCanvas);
const sCtx = slowCanvas.getContext('2d');

function applySpeed() {
  speedLabel.textContent = SPEEDS[speedIdx].label;
  if (slowTimer) { clearInterval(slowTimer); slowTimer=null; }

  const interval = SPEEDS[speedIdx].interval;
  if (interval > 0 && !gifPaused) {
    // スロー：canvasの解像度を枠のピクセルサイズに合わせ、
    // drawImageContain()で縦横比を保ちながら一定間隔で焼き付ける。
    // imgは裏でそのまま動き続けている（見た目はcanvasが覆っている）。
    slowCanvas.style.display = 'block';
    slowCanvas.width  = sampleImg.clientWidth;
    slowCanvas.height = sampleImg.clientHeight;
    slowTimer = setInterval(() => {
      if (!gifPaused) {
        drawImageContain(sCtx, slowCanvas, sampleImg);
      }
    }, interval);
  } else {
    // 標準・速い：slowCanvasを非表示にして、裏で動いているimgをそのまま見せる
    slowCanvas.style.display = 'none';
  }

  // 速度が変わったら、文字の切り替え間隔も合わせて更新
  if (!gifPaused) {
    startCharCycle();
  }
}

// 🐢 押すたびに 標準→ゆっくり→遅い×2→標準 とトグル
document.getElementById('gifSlowBtn').onclick = () => {
  speedIdx = (speedIdx - 1 + SPEEDS.length) % SPEEDS.length;
  applySpeed();
};

// ===== 境界スライダー =====
const stage      = document.getElementById('stage');
const samplePane = document.getElementById('samplePane');
const cameraPane = document.getElementById('cameraPane');
const divider    = document.getElementById('divider');
let splitRatio   = 0.42;
let isDragging   = false;

function isLandscape() { return window.innerWidth > window.innerHeight; }

function updateLayout() {
  const land = isLandscape();
  if (!land) {
    // 縦：上下分割
    samplePane.style.cssText = `height:${splitRatio*100}%;width:100%;flex:none;`;
    cameraPane.style.cssText = `height:${(1-splitRatio)*100}%;width:100%;flex:none;`;
    divider.style.cssText    = `left:0;right:0;top:calc(${splitRatio*100}% - 3px);height:6px;width:100%;cursor:ns-resize;`;
  } else {
    // 横：左右分割
    samplePane.style.cssText = `width:${splitRatio*100}%;height:100%;flex:none;`;
    cameraPane.style.cssText = `width:${(1-splitRatio)*100}%;height:100%;flex:none;`;
    divider.style.cssText    = `top:0;bottom:0;left:calc(${splitRatio*100}% - 3px);width:6px;height:100%;cursor:ew-resize;`;
  }
}

divider.addEventListener('pointerdown', e => {
  isDragging = true;
  divider.setPointerCapture(e.pointerId);
  e.preventDefault();
});
divider.addEventListener('pointermove', e => {
  if (!isDragging) return;
  const r = stage.getBoundingClientRect();
  if (!isLandscape()) {
    splitRatio = Math.min(0.85, Math.max(0.15, (e.clientY - r.top) / r.height));
  } else {
    splitRatio = Math.min(0.85, Math.max(0.15, (e.clientX - r.left) / r.width));
  }
  updateLayout();
});
divider.addEventListener('pointerup',    () => { isDragging = false; refreshFrozenCanvases(); });
divider.addEventListener('pointercancel',() => { isDragging = false; });
window.addEventListener('resize', () => { updateLayout(); refreshFrozenCanvases(); });

// 画面回転や分割位置の変更で枠のサイズが変わったとき、
// 一時停止中・スロー再生中のcanvasも新しいサイズに合わせて描き直す
function refreshFrozenCanvases() {
  if (gifPaused) {
    pauseCanvas.width  = sampleImg.clientWidth;
    pauseCanvas.height = sampleImg.clientHeight;
    drawImageContain(pCtx, pauseCanvas, sampleImg);
  } else if (SPEEDS[speedIdx].interval > 0) {
    slowCanvas.width  = sampleImg.clientWidth;
    slowCanvas.height = sampleImg.clientHeight;
    drawImageContain(sCtx, slowCanvas, sampleImg);
  }
}

// ===== カメラ =====
const startScreen  = document.getElementById('start-screen');
const cameraScreen = document.getElementById('camera-screen');
const errorScreen  = document.getElementById('error-screen');
const video        = document.getElementById('video');
const guideOverlay = document.getElementById('guide-overlay');
let currentStream  = null;
let guideVisible   = false;

function showScreen(name) {
  startScreen.hidden  = name !== 'start';
  cameraScreen.hidden = name !== 'camera';
  errorScreen.hidden  = name !== 'error';
}

async function startCamera() {
  stopCamera();
  speedIdx = 2;
  loadSample(0);
  showScreen('camera');
  requestAnimationFrame(updateLayout);
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'user' }, audio:false });
    currentStream = stream;
    video.srcObject = stream;
    video.classList.add('mirrored');
  } catch(err) { showError(err); }
}

function stopCamera() {
  if (currentStream) { currentStream.getTracks().forEach(t=>t.stop()); currentStream=null; }
  if (slowTimer)     { clearInterval(slowTimer); slowTimer=null; }
  stopCharCycle();
}

function showError(err) {
  let msg = 'カメラを起動できませんでした。';
  if (err?.name==='NotAllowedError')  msg='カメラへのアクセスが許可されていません。「設定」→「Safari」→「カメラ」で許可してください。';
  if (err?.name==='NotFoundError')    msg='カメラが見つかりませんでした。';
  if (err?.name==='NotReadableError') msg='他のアプリがカメラを使用している可能性があります。';
  document.getElementById('errorMessage').textContent = msg;
  showScreen('error');
}

document.getElementById('startBtn').onclick   = () => startCamera();
document.getElementById('retryBtn').onclick   = () => startCamera();
document.getElementById('stopBtn').onclick    = () => { stopCamera(); showScreen('start'); };
document.getElementById('settingBtn').onclick = () => { stopCamera(); showScreen('start'); };

document.getElementById('guideToggleBtn').onclick = () => {
  guideVisible = !guideVisible;
  guideOverlay.hidden = !guideVisible;
  const btn = document.getElementById('guideToggleBtn');
  btn.classList.toggle('active', guideVisible);
  btn.textContent = guideVisible ? 'ガイド非表示' : 'ガイド表示';
};

document.addEventListener('visibilitychange', () => {
  if (document.hidden) stopCamera();
  else if (!cameraScreen.hidden && !currentStream) startCamera();
});
window.addEventListener('pagehide', stopCamera);

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
</script>
